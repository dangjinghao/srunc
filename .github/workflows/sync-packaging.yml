name: Sync packaging

# Runs after a GitHub Release is published (which happens at the end of
# release.yml). Re-runs scripts/bump-packaging.sh against the release's
# SHA256SUMS to get fresh sha256 strings, then mirrors each updated
# template into its publishing repo:
#
#   packaging/homebrew/authu.rb  →  WangYihang/homebrew-tap, Formula/authu.rb
#   packaging/scoop/authu.json   →  WangYihang/scoop-bucket, bucket/authu.json
#   packaging/aur/PKGBUILD       →  ssh://aur@aur.archlinux.org/authu-bin.git
#
# Required secrets (set under repo Settings → Secrets and variables → Actions):
#
#   PACKAGING_PAT          a fine-grained GitHub PAT with `Contents: read+write`
#                          on WangYihang/homebrew-tap and WangYihang/scoop-bucket
#   AUR_SSH_PRIVATE_KEY    the private key whose pubkey is registered on your
#                          aur.archlinux.org account (ed25519 recommended)
#
# Trigger manually for past releases via the Actions tab → "Sync packaging" →
# "Run workflow" → enter version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to sync (e.g. 0.3.0, without the leading "v")'
        required: true

permissions:
  contents: read

jobs:
  homebrew:
    name: → homebrew-tap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${{ github.event.release.tag_name }}"
            v="${v#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Bump packaging templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/bump-packaging.sh "${{ steps.ver.outputs.version }}"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: WangYihang/homebrew-tap
          token: ${{ secrets.PACKAGING_PAT }}
          path: tap

      - name: Sync formula
        run: |
          mkdir -p tap/Formula
          cp packaging/homebrew/authu.rb tap/Formula/authu.rb
          cd tap
          if git diff --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/authu.rb
          git commit -m "authu ${{ steps.ver.outputs.version }}"
          git push

  scoop:
    name: → scoop-bucket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${{ github.event.release.tag_name }}"
            v="${v#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Bump packaging templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/bump-packaging.sh "${{ steps.ver.outputs.version }}"

      - name: Checkout scoop-bucket
        uses: actions/checkout@v4
        with:
          repository: WangYihang/scoop-bucket
          token: ${{ secrets.PACKAGING_PAT }}
          path: bucket

      - name: Sync manifest
        run: |
          mkdir -p bucket/bucket
          cp packaging/scoop/authu.json bucket/bucket/authu.json
          cd bucket
          if git diff --quiet; then
            echo "Manifest already up to date."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/authu.json
          git commit -m "authu ${{ steps.ver.outputs.version }}"
          git push

  aur:
    name: → AUR (authu-bin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${{ github.event.release.tag_name }}"
            v="${v#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Bump packaging templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/bump-packaging.sh "${{ steps.ver.outputs.version }}"

      # Uses an Arch container so makepkg is available to regenerate .SRCINFO
      # from PKGBUILD. Pushes via SSH to ssh://aur@aur.archlinux.org/authu-bin.git.
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: authu-bin
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: github-actions[bot]
          commit_email: 41898282+github-actions[bot]@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "authu-bin ${{ steps.ver.outputs.version }}"
