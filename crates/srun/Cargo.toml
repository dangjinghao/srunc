[package]
name = "srun-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Sync HTTP client speaking the srun (深澜) captive-portal auth protocol, plus DNS-free captive-redirect discovery so it works against any srun deployment without hand-fed host or ac_id."
keywords = ["srun", "captive-portal", "authentication", "http-client", "campus-network"]
categories = ["network-programming", "authentication"]

[dependencies]
srun-core = { path = "../srun-core", version = "0.3.0" }
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[dev-dependencies]
httpmock = "0.8"
