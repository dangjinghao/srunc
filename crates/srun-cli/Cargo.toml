[package]
name = "authu"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
description = "Generic, auto-configuring srun (深澜) campus-portal auth CLI. Works on any srun deployment — host and ac_id are auto-discovered from the captive-portal redirect. Static musl binary suitable for OpenWrt routers."
keywords = ["srun", "captive-portal", "tsinghua", "cli", "campus-network"]
categories = ["command-line-utilities", "network-programming", "authentication"]

[[bin]]
name = "authu"
path = "src/main.rs"

# Lets `cargo binstall authu` fetch the prebuilt binary from our GitHub Release
# instead of compiling from source. The defaults assume archives named
# `{name}-v{version}-{target}.{ext}`, but we drop the `v{version}` — override.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

# Debian package, produced by `cargo deb`. Triggered from CI for x86_64-gnu
# and aarch64-gnu targets (musl binaries aren't .deb-friendly).
[package.metadata.deb]
name = "authu"
maintainer = "Yihang Wang <wangyihanger@gmail.com>"
copyright = "2026, Yihang Wang <wangyihanger@gmail.com>"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Generic, auto-configuring srun (深澜) captive-portal auth client for Chinese \
university campus networks. Host and ac_id are auto-discovered from the \
captive redirect — most setups only need username + password."""
section = "net"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/authu",                          "usr/bin/",                       "755"],
    ["../../docs/config.example.toml",                "usr/share/doc/authu/",           "644"],
    ["../../docs/systemd/system/authu.service",       "lib/systemd/system/",            "644"],
    ["../../docs/systemd/system/authu@.service",      "lib/systemd/system/",            "644"],
    ["../../docs/systemd/user/authu.service",         "usr/lib/systemd/user/",          "644"],
    ["../../README.md",                               "usr/share/doc/authu/README.md",  "644"],
]

[dependencies]
srun-core = { path = "../srun-core", version = "0.2.4" }
srun-client = { path = "../srun", version = "0.2.4" }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "color", "suggestions", "error-context", "wrap_help"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
basic-toml = "0.1"
ctrlc = { version = "3", features = ["termination"] }
rpassword = "7"
anyhow = "1"
ureq = "2"
log = "0.4"
# Strip features we don't use: humantime (jiff timestamp dep), regex
# (RUST_LOG regex filters — we only need plain module-prefix matches),
# unstable-kv. Keeps the binary small.
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
# Tiny ANSI styling helpers (already in the tree via env_logger / clap).
# anstream auto-disables colors when stdout isn't a TTY.
anstyle = "1"
anstream = "0.6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
httpmock = "0.8"
