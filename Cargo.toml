[workspace]
resolver = "2"
members = ["crates/srun-core", "crates/srun", "crates/srun-cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/WangYihang/srunc"
homepage = "https://github.com/WangYihang/srunc"
authors = ["Yihang Wang <wangyihanger@gmail.com>"]
rust-version = "1.74"

# Optimize the release artifacts for size — these binaries are meant to ship to
# routers (OpenWRT) and other flash-constrained boxes.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
