[package]
name = "srun"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Imperative shell over srun-core: a sync HTTP client speaking the srun (深澜) campus-portal protocol, plus a Tsinghua site adapter."

[dependencies]
srun-core = { path = "../srun-core" }
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
