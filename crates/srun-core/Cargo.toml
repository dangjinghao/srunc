[package]
name = "srun-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Pure, no_std-friendly core of the srun (深澜) campus-portal auth protocol: XEncode (XXTEA variant), the quirk base64, MD5/SHA1 helpers, and login-parameter assembly. Zero I/O, zero global state."
keywords = ["srun", "captive-portal", "xxtea", "no-std", "campus-network"]
categories = ["cryptography", "no-std", "network-programming", "authentication"]

[dependencies]
sha1 = { version = "0.10", default-features = false }
md-5 = { version = "0.10", default-features = false }
