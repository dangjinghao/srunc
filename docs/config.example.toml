# srunc config file (TOML).
#
# Search order:
#   1. --config / -c <path>
#   2. $SRUNC_CONFIG
#   3. $XDG_CONFIG_HOME/srunc/config.toml
#   4. ~/.config/srunc/config.toml
#   5. ~/.srunc.toml
#
# For service contexts also try /etc/srunc/config.toml (pass -c explicitly).

username = "your-username"
password = "your-password"

# All of the below are optional — most users only need username + password.

# profile = ""          # built-in (host, ac_id) preset; `srunc profiles list`
# host = ""             # override portal hostname (auto-discovered if blank)
# ac_id = ""            # override ac_id (auto-discovered if blank)
# insecure = false      # use http:// instead of https://
# timeout = 2           # HTTP timeout, seconds
# ip = ""               # auth for a specific IP (proxy mode)
# daemonize = false     # set true for systemd/init.d contexts
