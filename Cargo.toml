[workspace]
resolver = "2"
members = ["crates/srun-core", "crates/srun-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/wangyihang/authu"

# Optimize the release artifacts for size — these binaries are meant to ship to
# routers (OpenWRT) and other flash-constrained boxes.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
